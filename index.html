 39% {box-shadow:0 0 0 7px var(--pulso-medio);transform:scale(1.009)}
 52% {box-shadow:0 0 0 3px var(--pulso-fraco);transform:scale(1)}
 100%{box-shadow:0 0 0 3px var(--pulso-fraco);transform:scale(1)}}

bom", "tit": "Habilidades desta aula", "itens": ["<b>EF06CO03</b> · descrever com precisão a solução de um problema e construir o programa que executa essa solução.", "<b>EF06CO05</b> · identificar o que entra e o que sai de um problema, e o tipo de cada dado."]}], "foco": true}, {"cod": "S.01", "rot": "Lição 01", "titulo": "O mago e as bolhas geométricas", "forma": "circ", "modo": "construir", "blocos": [{"t": "acao", "ico": "olho", "x": "Nesta unidade você cria <b>dois projetos</b> no StartLab. O primeiro é o <b>Mago das bolhas</b>."}, {"t": "figura", "rot": "o caminho do projeto", "html": "<p>O mago faz bolhas de sabão em forma de <b>figuras geométricas</b>.</p><p>Quem desenha é a <b>varinha</b>, que vira uma caneta.</p><p>Hoje a varinha desenha <b>triângulos</b>. O segundo projeto, a corrida matemática, fica para as próximas aulas.</p>"}, {"t": "aviso", "tipo": "bom", "tit": "A regra que vale para toda figura", "itens": ["A caneta sempre dá uma volta inteira: <b>360 graus</b>.", "Esses 360 são divididos pelo <b>número de lados</b> da forma.", "O triângulo tem 3 lados, então cada giro é 360 dividido por 3."]}, {"t": "conf", "itens": ["Entendi o que vamos construir hoje"]}, {"t": "rapida", "peso": "treino", "v": "Para fechar uma figura, a caneta dá uma volta de 360 graus no total.", "f": "Para fechar uma figura, a caneta gira 360 graus em cada lado.", "exp": "São 360 graus na volta inteira, divididos pelos lados. No triângulo, 120 em cada canto.", "v2": "A volta completa é 360 graus, repartida entre os lados da forma.", "f2": "Cada lado da forma gira 360 graus sozinho.", "bloom": "B2"}], "foco": true, "obj": 0}, {"cod": "S.02", "rot": "Lição 02 ✋ VOCÊ FAZ", "titulo": "O cenário e o mago", "forma": "circ", "modo": "construir", "blocos": [{"t": "intro", "x": "Abra o StartLab pela atividade <b>Meu Projeto - Comece Aqui</b> e clique em <b>Iniciar meu projeto</b>."}, {"t": "passo", "n": "1", "tit": "Escolher o cenário", "itens": [["mouse", "No canto inferior direito, c function montaTelas(){
 var html = "", n = 0;
 D.aulas.forEach(function(A){
  A.telas.forEach(function(t){
   n++;
   var id = "t_"+n, ctx = A.ch+"_"+t.cod;
   var sub = t.sub || "";
   if(!sub) (t.blocos||[]).forEach(function(b){
    if(b.t==="opcard" && b.i!==undefined && A.objetivos[b.i]) sub = A.objetivos[b.i][0];
    if(b.t==="objetivos") sub = A.objetivos.length+" objetivos desta aula";
   });
   NOMEAULA_[A.ch] = A.nome;
   TELAS.push({id:id, aula:A.ch, cor:A.cor, nome:A.nome, cod:t.cod, rot:t.rot,
               titulo:t.titulo, forma:t.forma, modo:t.modo||"construir", obj:t.obj,
               teste:t.teste===true, sub:sub, ctx:ctx, foco:t.foco, modo:t.modo||"construir"});
   var corpo = "";
   (t.blocos||[]).forEach(function(b,bi){corpo += bloco(b, ctx, bi)});
   html += '<section class="tela" id="'+id+'" data-aula="'+A.ch+'" data-modo="'+(t.modo||"construir")+'">'
        +  '<span class="cod">'+A.nome+' · '+t.rot.toUpperCase()+'</span>'
        +  '<h2 class="th">'+t.titulo+'</h2>'+corpo+'</section>';
  });
 });
 el("palco").innerHTML = html;
}

/* ============================================================
   PENDENCIAS E TRAVAS
   ============================================================ */
function pendencias(i){ try{ return _pend(i) }catch(e){ return ["algo não carregou nesta tela · avise o professor"] } }
function _pend(i){
 var t = el(TELAS[i].id), f = [];
 if(!t) return f;
 if(!ler("visto_"+TELAS[i].id,0)) f.push("abrir esta tela e ler o que tem nela");
 if(el("gNome") && t.querySelector("#gNome")){
  if(!el("gNome").value.trim()) f.push("escrever o seu nome e sobrenome");
  if(!document.querySelector(".tm.on")) f.push("escolher a sua turma");
 }
 t.querySelectorAll('[data-obrig="1"]').forEach(function(c){
  if(!c.value.trim()){
   var l = t.querySelector('label[for="'+c.id+'"]');
   f.push("preencher: "+(l?l.textContent:"um campo"));
  }
 });
 t.querySelectorAll("[data-cop]").forEach(function(b){
  if(!b.classList.contains("feito")) f.push("clicar no botão Copiar de “"+b.querySelector(".cab2 span").textContent+"”");
 });
 if(P.glossario_pastilha){
  var np = t.querySelectorAll(".termo-cod:not(.lido)").length;
  if(np) f.push("ler "+np+" pastilha(s) de glossário desta tela");
 }
 t.querySelectorAll(".conf").forEach(function(c){
  c.querySelectorAll("input.cf").forEach(function(x){
   if(!x.checked) f.push("marcar: "+x.parentNode.textContent.trim());
  });
 });
 t.querySelectorAll(".rapida").forEach(function(r){
  if(r.getAttribute("data-fim")!=="1") f.push("responder a perguntinha desta tela");
 });
 t.querySelectorAll(".atv").forEach(function(box){
  var n = box.querySelectorAll('.aq:not([data-fim="1"])').length;
  if(n) f.push("responder "+n+" pergunta(s) da atividade oficial");
 });
 t.querySelectorAll(".senhabox").forEach(function(box){
  if(!box.classList.contains("aberta")) f.push("esperar o professor liberar esta tela");
 });
 t.querySelectorAll(".verif").forEach(function(box){
  var n = box.querySelectorAll('.vq:not([data-fim="1"])').length;
  if(n) f.push("responder "+n+" pergunta(s) da verificação");
 });
 return f;
}

 var h = "";
 ordem.forEach(function(a){
  h += '<div class="linha"><span class="rotl">'+g[a][0][0].nome+'</span>';
  g[a].forEach(function(p,k){
   var t = p[0], i = p[1];
   h += '<span data-ir="'+i+'" title="'+t.rot+' · '+t.titulo+(t.teste?" · tem teste":"")+'">'
      + svgForma(t.forma,t.cor).replace('class="mk"','class="mk'+(i===atual?" now":"")+'"')
      + '</span>'
      + (t.teste ? '<span class="setateste" title="tem teste"></span>' : '');
   var prox = g[a][k+1];
   if(t.forma==="pausa" && prox && prox[0].forma!=="pausa") h += '<span class="barrinha"></span>';
  });
  h += "</div>";
 });
 var usadas = {}, temTeste = false;
 TELAS.forEach(function(t){usadas[t.forma]=t.cor; if(t.teste) temTeste = true});
 h += '<div class="leg">';
 Object.keys(usadas).forEach(function(f){
  h += "<span>"+svgForma(f,usadas[f],15)+" "+(FORMA_NOME[f]||f)+"</span>";

 if(temTeste) h += '<span><span class="setateste"></span> '+FORMA_NOME.seta+'</span>';
 el("trilha").innerHTML = h+"</div>";
 document.querySelectorAll("[data-ir]").forEach(function(b){
  b.addEventListener("click",function(){mostra(+this.getAttribute("data-ir"))});
 });

        ? '<div class="faixa f-verde">DISPUTA · só as '+pr.vagas+' primeiras duplas a apresentar</div>'

  box.innerHTML = st + '<div class="cred" style="margin-top:14px">'
   + '<div class="credsel">CREDENCIAL DE APRESENTAÇÃO · '+(NOMEAULA_[ch]||ch)+'</div>'
   + '<h3>'+(v("gNome")||"—")+" + "+(v("gPar")||"sem parceiro")+'</h3>'
   + '<div class="credl"><span>Turma</span><b>'+ler("turma","—")+'</b></div>'
   + '<div class="credl"><span>Nota da aula</span><b>'+fmt(n)+" · "+f[1]+'</b></div>'
   + '<div class="credl"><span>Telas concluídas</span><b>'+feitas+" de "+tot+'</b></div>'
   + '<div class="credl"><span>Hora de conclusão</span><b>'+(hora||"ainda não")+'</b></div>'
   + (D.credencial_extra||[]).map(function(c){
       return '<div class="credl"><span>'+c[1]+'</span><b>'+(v(c[0])||"—")+'</b></div>'}).join("")
   + (function(){ var vz=[v("gViz1"),v("gViz2")].filter(Boolean).join(" e ");
       return vz ? '<div class="credl"><span>Dupla vizinha</span><b>'+vz+'</b></div>' : "" })()
   + (function(){
       var aj = [1,2,3,4].map(function(k){
         var n = v("gAj_"+ch+"_"+k), nt = v("gNt_"+ch+"_"+k);
         return n ? (n + (nt ? " · " + nt : "")) : "";
       }).filter(Boolean);
       return aj.length ? '<div class="credl"><span>Equipe que eu ajudei</span><b>'+aj.join("<br>")+'</b></div>' : "" })()
   + (aus?'<div class="credl"><span>Parceiro</span><b style="color:#C0392B">parou às '+aus.h+' · '+aus.m+'</b></div>':"")
   + (function(){ var pa=ler("pausa",null);
       return pa ? '<div class="credl"><span>Parceiro</span><b style="color:#5B6B7C">pausou às '+pa.h+' · volta</b></div>' : "" })()
   + '</div>'
   + '<div class="aviso cuidado" style="margin-top:14px"><b class="tit">Como apresentar</b><ul>'
   + '<li>Levante a mão e <b>espere</b> ser chamado.</li>'
   + '<li>Vá com o seu parceiro, os dois com esta tela aberta.</li>'
   + '<li>Sem correria e sem fila na mesa do professor.</li></ul></div>';
 });
}

/* ============================================================
   CARD DE AUSENCIA
   ============================================================ */
function cardAusencia(){
 var pa = ler("pausa", null);
 var viz = [v("gViz1"), v("gViz2")].filter(Boolean).join(" e ");
 if(pa){
  abre('<h3 style="color:#5B6B7C">Parceiro em pausa</h3>'
   + '<div class="aviso cuidado"><b class="tit">Pausa registrada as ' + pa.h + '</b><ul>'
   + '<li>Siga o guia. Ele volta e continua de onde parou.</li>'
   + '<li>Isso nao conta como parceiro ausente.</li></ul></div>'
   + '<button class="btn prim" onclick="FACA.voltouParceiro()">O meu parceiro voltou</button>'
   + '<button class="btn" onclick="FACA.fecha()">Fechar</button>');
  return;
 }
 abre('<h3 style="color:#C0392B">O meu parceiro saiu</h3>'
  + '<p>Marque o que aconteceu. Voce continua daqui, sem esperar.</p>'
  + '<div class="aviso bom"><b class="tit">Ele volta em pouco tempo</b>'
  + '<p style="margin:0 0 8px;font-size:16px">Banheiro, agua, chamado pela coordenacao.</p>'
  + '<button class="btn" onclick="FACA.marcaPausa()">pausou, mas volta</button></div>'
  + '<div class="aviso perigo"><b class="tit">Ele nao volta hoje</b>'
  + ["faltou hoje","parou no meio","esta muito atras"].map(function(m){
      return '<button class="btn" onclick="FACA.marcaAusencia(\'' + m + '\')">' + m + '</button>' }).join("")
  + '</div>'
  + '<div class="aviso bom"><b class="tit">O que fazer se ele não voltar</b><ul>'
  + '<li>Siga o guia normalmente. A sua nota continua contando.</li>'
  + (viz ? '<li>Fique junto com a dupla vizinha, <b>' + viz + '</b>.</li>'
        : '<li>Fique junto com a dupla vizinha de mesa.</li>')
  + '<li>Ou procure alguém da turma que também ficou sozinho, e ofereça para trabalharem juntos.</li>'
  + '<li>Ninguém fica sozinho por causa de uma falta.</li></ul></div>'
  + '<button class="btn" onclick="FACA.fecha()">Fechar</button>');
}
function marcaPausa(){ grav("pausa", {h:new Date().toTimeString().slice(0,5)}); fecha(); credencial(); }
function voltouParceiro(){
 grav("pausa", null);
 credencial();
 var T = TELAS[atual] || {}, quantas = TELAS.length;
 var onde = (T.rot ? T.rot : "esta tela") + (T.titulo ? " · " + T.titulo : "");
 abre('<h3 style="color:#1E8449">Que bom que ele voltou</h3>'
  + '<div class="aviso bom"><b class="tit">Antes de continuar, esperem um do outro</b><ul>'
  + '<li>Você está em <b>' + onde + '</b>, tela ' + (atual+1) + ' de ' + quantas + '.</li>'
  + '<li>Conte para ele, em poucas palavras, o que rolou enquanto esteve fora.</li>'
  + '<li>Ajude ele a chegar nesta mesma tela. Não siga na frente sozinho.</li>'
  + '<li>A bala é da <b>dupla</b>. Um chegando na frente não vale bala para ninguém.</li>'
  + '<li>Se ele travar em alguma lição, use a lista de telas para voltar junto.</li></ul></div>'
  + '<button class="btn prim" onclick="FACA.fecha()">Combinado, vamos juntos</button>');
}
function marcaAusencia(m){
 grav("ausencia", {h:new Date().toTimeString().slice(0,5), m:m});
 grav("pausa", null); fecha(); credencial();
}

/* ============================================================
   INICIO
   ============================================================ */
function inicia(){
 montaTelas();
 ligaPastilhas(); ligaCopiar(); ligaRapidas(); ligaVerif(); ligaAtv(); ligaVF(); ligaSenha(); ligaCampos();
 topoDupla(); pintaPessoas(); refazTextos(); pintaSug(); pintaSugestoes(); pintaEco();
 el("tver").textContent = D.meta.versao + (PROF?"-TESTE":"") + " · motor v"+MOTOR_V;
 el("bAvanca").addEventListener("click",avanca);
 el("bVolta").addEventListener("click",function(){ ajustaFoco(atual-1); mostra(atual-1) });
 el("bLista").addEventListener("click",lista);
 if(P.premiacao){
  var b = document.createElement("button");
  b.className = "nb alerta"; b.textContent = "⚠ meu parceiro saiu";
  b.addEventListener("click",cardAusencia);
  el("nav").appendChild(b);
 }
 document.addEventListener("change",function(e){
  if(e.target.classList && e.target.classList.contains("cf")){
   var t = e.target.closest(".tela"), c = e.target.closest(".conf");
   var idx = Array.prototype.indexOf.call(c.querySelectorAll("input.cf"), e.target);
   grav("ck_"+t.id+"_"+c.getAttribute("data-k")+"_"+idx, e.target.checked?1:0);
   pintaConf(c);
   placar(); credencial(); pintaFalta();
  }
 });
 document.querySelectorAll(".conf").forEach(function(c){
  var t = c.closest(".tela");
  c.querySelectorAll("input.cf").forEach(function(x,idx){
   if(ler("ck_"+t.id+"_"+c.getAttribute("data-k")+"_"+idx,0)) x.checked = true;
  });
  pintaConf(c);
 });
 mostra(ler("tela",0));
}
var MOTOR_V = "1.18";
window.FACA = {ir:function(i){ajustaFoco(i);fecha();mostra(i)}, fecha:fecha, marcaAusencia:marcaAusencia,
 marcaPausa:marcaPausa, voltouParceiro:voltouParceiro};
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",inicia);
else inicia();
})();

</script>
<!-- CAMADA NAV.OF -->
<style>
/* ============================================================
   CAMADA NAV.OF · complemento do motor-faca v1.31
   NAO altera motor-faca.js nem motor-faca.css · e carregada
   DEPOIS deles e so acrescenta comportamento.
   Origem: FACA-SHEETS CLD-051 e CLD-053 · aplicado no FACA-START.
   ============================================================ */

/* ---- atividade oficial · quatro tentativas ---- */
.aq .otent{margin-top:12px;font:800 16px/1.6 var(--mono);color:#5A6B7B}
.aq .aalt.errada{border-color:#C1121F !important;background:#FCEBEC !important;
  color:#7F1D1D !important;opacity:.75;cursor:default}
.aq .aalt.errada .alt-l{background:#C1121F !important;color:#fff !important}
.aq .aalt.certa{border-color:#1B7A3A !important;background:#E4F5E8 !important;font-weight:700}
.aq .aalt.certa .alt-l{background:#1B7A3A !important;color:#fff !important}
.navof-dicas{border:3px solid #C25E00 !important;background:#FDF0E4 !important;
  color:#5B3A00 !important;border-radius:12px;padding:11px 13px;font-size:17px}
.navof-dicas .nd{display:block;margin-top:7px;font-size:17px;line-height:1.5}
.navof-dicas .nd:first-of-type{margin-top:2px}
.navof-dicas .nd::before{content:"DICA " counter(nd) " · ";counter-increment:nd;
  font:800 16px/1.5 var(--mono);color:#C25E00}

/* ---- lista de telas · caixa de conferido ---- */
.it .itok{width:26px;height:26px;border-radius:7px;border:3px solid #C1121F;

  text-align:center;visibility:visible;flex:0 0 auto;box-sizing:border-box;margin-left:auto}
.it.visto .itok{border-color:#1B7A3A;background:#1B7A3A;color:#fff}
.it[class*="ln-"] .itok{box-shadow:0 0 0 2px #fff}

/* ---- lista de telas · degrade com verniz por tipo ---- */
.it[class*="ln-"]{position:relative;overflow:hidden;color:#fff !important;
  border-color:transparent !important;
  background-image:
    linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.10) 42%,
      rgba(255,255,255,0) 52%,rgba(0,0,0,.16) 100%),
    radial-gradient(115% 150% at 82% -35%,rgba(255,255,255,.52) 0%,rgba(255,255,255,0) 55%),
    linear-gradient(152deg,var(--c1) 0%,var(--c2) 52%,var(--c3) 100%)}
.it[class*="ln-"] .ittx,.it[class*="ln-"] .num,.it[class*="ln-"] .itsub,
.it[class*="ln-"] .llpronta,.it[class*="ln-"] .llfalta{color:#fff !important}
.it.ln-atv::after,.it.ln-ess::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.14) 43%,
    rgba(255,255,255,.62) 50%,rgba(255,255,255,.14) 57%,rgba(255,255,255,0) 66%);
  background-size:240% 100%;animation:navofLuz 4.6s linear infinite}
@keyframes navofLuz{from{background-position:150% 0}to{background-position:-60% 0}}
.it.ln-atv{--c1:#E0544F;--c2:#C1121F;--c3:#7A0A14}
.it.ln-ess{--c1:#5A6672;--c2:#2A323B;--c3:#0E1216}
.it.ln-faz{--c1:#3FA3D8;--c2:#1C6FA8;--c3:#0E4470}
.it.ln-des{--c1:#E0A22B;--c2:#C2760C;--c3:#8A4E04}
.it .ptl{display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:3px 12px;min-height:28px;font:800 16px/1.5 var(--mono);white-space:nowrap;
  border:3px solid #fff;background:#fff;color:var(--c3)}
@media (prefers-reduced-motion:reduce){.it.ln-atv::after,.it.ln-ess::after{animation:none;
  background-position:45% 0}}


/* ---- v02.00 ---- */

/* numeracao X.Y dos passos · desliga o contador do motor */
.psub li::before{content:"" !important;background:transparent !important;
  flex:0 0 0 !important;width:0 !important;margin:0 !important;padding:0 !important;
  box-shadow:none !important;border:0 !important}
.psub li .psn{flex:0 0 auto;min-width:46px;height:26px;border-radius:9px;
  border:3px solid var(--ic,#4A2C7D);background:#fff;color:var(--ic,#4A2C7D);
  font:800 16px/20px var(--mono);text-align:center;box-sizing:border-box}

/* bordas grossas · piso de 3px nos blocos de conteudo */
.passo,.aviso,.conf,.figura,.copiar,.nota,.subnota{border-width:3px !important}

/* mapa da unidade · cards clicaveis */
.navof-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.navof-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.navof-card .navof-ir{display:block;margin-top:9px;font:800 16px/1.5 var(--mono);
  border-top:2px solid rgba(255,255,255,.45);padding-top:7px}


/* ---- v03.00 · modo LIVRE ---- */
.it.trav{opacity:1 !important;background:#fff !important}
.it .llfalta{opacity:.85}
</style>
<script>
/* ============================================================
   CAMADA NAV.OF · complemento do motor-faca v1.31
   O motor roda dentro de um IIFE e nao expoe nada. Esta camada
   NAO altera o motor: ela intercepta o clique na fase de captura,
   antes de chegar ao botao, e so deixa passar quando a questao
   deve realmente fechar. Pontuacao, placar e gravacao continuam
   sendo feitos pelo motor, sem copia nenhuma aqui.
   1 · quatro tentativas na atividade oficial objetiva
   2 · tres dicas graduadas, uma por erro
   3 · caixa de conferido na lista de telas
   4 · linha colorida por tipo na lista (degrade com verniz)
   ============================================================ */
(function(){
"use strict";

function ligaNavOf(){
 document.querySelectorAll(".atv .aq:not(.ord):not(.vf)").forEach(function(q){
  if(q.getAttribute("data-navof") === "1") return;
  q.setAttribute("data-navof","1");
  if(q.getAttribute("data-fim") === "1") return;

  var c = +q.getAttribute("data-c");
  var cxd = q.querySelector(".adica");
  var dicas = cxd ? [].slice.call(cxd.querySelectorAll(".nd")) : [];
  if(cxd && dicas.length){
   cxd.classList.add("navof-dicas");
   dicas.forEach(function(d){ d.classList.add("nd-off") });
   cxd.style.display = "none";
  }
  var tt = document.createElement("div");
  tt.className = "otent";
  tt.textContent = "tentativa 1 de 4";
  q.appendChild(tt);

  var t = 0;
  q.addEventListener("click", function(e){
   var b = e.target;
   while(b && b !== q && !(b.classList && b.classList.contains("aalt"))) b = b.parentNode;
   if(!b || b === q || b.disabled) return;
   if(q.getAttribute("data-fim") === "1") return;

   var alts = [].slice.call(q.querySelectorAll(".aalt"));
   var ai = alts.indexOf(b);
   t++;

   if(ai === c || t >= 4){
    setTimeout(function(){
     tt.textContent = (ai === c)
       ? ("acertou na tentativa " + t + " de 4")
       : "as quatro tentativas foram usadas";
     if(cxd && dicas.length){
      cxd.style.display = "";
      dicas.forEach(function(d){ d.classList.remove("nd-off") });
     }
    }, 0);
    return;                       /* deixa o motor fechar e pontuar */
   }

   e.stopPropagation();
   e.preventDefault();
   b.classList.add("errada");
   b.disabled = true;
   if(cxd && dicas[t-1]){
    cxd.style.display = "";
    dicas[t-1].classList.remove("nd-off");
   }
   tt.textContent = "tentativa " + (t+1) + " de 4";
  }, true);
 });
}

var TIPOS = [
 ["ATIVIDADE", "ln-atv", "📋 ATIVIDADE"],
 ["ESSENCIAL", "ln-ess", "🔑 ESSENCIAL"],
 ["VOCÊ FAZ",  "ln-faz", "✋ VOCÊ FAZ"],
 ["DESAFIO",   "ln-des", "🎯 DESAFIO"]
];

function arrumaLista(){
 var telas = document.querySelectorAll(".palco .tela");
 document.querySelectorAll(".it[data-ir2]").forEach(function(it){
  if(it.getAttribute("data-navof") === "1") return;
  it.setAttribute("data-navof","1");

  var ck = it.querySelector(".ck");
  if(ck){
   var feito = ck.textContent.indexOf("✅") >= 0;
   var cx = document.createElement("span");
   cx.className = "itok";
   cx.innerHTML = "&#10003;";
   ck.parentNode.replaceChild(cx, ck);
   if(feito) it.classList.add("visto");
  }

  var i = +it.getAttribute("data-ir2"), rot = "";
  var sec = telas[i];
  if(sec){
   var cod = sec.querySelector(".cod");
   if(cod) rot = cod.textContent || "";
  }
  for(var n = 0; n < TIPOS.length; n++){
   if(rot.toUpperCase().indexOf(TIPOS[n][0]) >= 0){
    it.classList.add(TIPOS[n][1]);
    var p = document.createElement("span");
    p.className = "ptl";
    p.textContent = TIPOS[n][2];
    var tx = it.querySelector(".ittx");
    if(tx && tx.parentNode) tx.parentNode.insertBefore(p, tx.nextSibling);
    break;
   }
  }
 });
}


/* ---------- 5 · numeracao X.Y dos passos ---------- */
function numeraPassos(){
 document.querySelectorAll(".passo").forEach(function(p){
  if(p.getAttribute("data-navof") === "1") return;
  p.setAttribute("data-navof","1");
  var n = p.querySelector(".pnum");
  var x = n ? (n.textContent || "").trim() : "";
  if(!x) return;
  p.querySelectorAll(".psub > li").forEach(function(li, i){
   var s = document.createElement("span");
   s.className = "psn";
   s.textContent = x + "." + (i+1);
   li.insertBefore(s, li.firstChild);
  });
 });
}

/* ---------- 6 · versao real do motor no topo ---------- */
function arrumaVersao(){
 var t = document.getElementById("tver");
 if(!t) return;
 var s = t.textContent || "";
 if(s.indexOf("motor v") < 0) return;
 t.textContent = s.replace(/motor v[\d.]+/, "motor v1.31 + NAV.OF");
}

/* ---------- 7 · mapa da unidade · card leva para a aula ---------- */
function ligaMapa(){
 document.querySelectorAll("[data-navof-aula]").forEach(function(card){
  if(card.getAttribute("data-navof") === "1") return;
  card.setAttribute("data-navof","1");
  var ch = card.getAttribute("data-navof-aula");
  var telas = [].slice.call(document.querySelectorAll(".palco .tela"));
  var alvo = -1;
  for(var i = 0; i < telas.length; i++){
   if(telas[i].getAttribute("data-aula") === ch){ alvo = i; break }
  }
  if(alvo < 0) return;
  card.classList.add("navof-card");
  var ir = document.createElement("span");
  ir.className = "navof-ir";
  ir.textContent = "▸ clique para ir";
  card.appendChild(ir);
  card.addEventListener("click", function(){
   if(window.FACA && window.FACA.ir){ window.FACA.ir(alvo); return }
   var b = document.getElementById("bLista");
   if(!b) return;
   b.click();
   setTimeout(function(){
    var it = document.querySelector('.it[data-ir2="' + alvo + '"]');
    if(it) it.click();
   }, 120);
  });
 });
}


/* ---------- 8 · modo LIVRE · nenhuma tela trancada ----------
   O motor nao desabilita o botao Avancar: ele abre um aviso
   "Falta uma coisa" e nao anda. A camada intercepta o clique
   antes disso e anda pela API publica do motor.
   A identificacao continua obrigatoria: na tela 1 o clique
   passa direto para o motor.
   PROF continua false · a chave de progresso segue sendo a do
   estudante, sem sufixo de teste.                            */
var LIVRE = true;

function atualAgora(){
 var c = document.getElementById("conta");
 if(!c) return -1;
 var m = /tela\s+(\d+)\s+de\s+(\d+)/i.exec(c.textContent || "");
 return m ? [+m[1]-1, +m[2]] : -1;
}

function ligaLivre(){
 var nav = document.getElementById("nav");
 if(!nav || !LIVRE) return;
 nav.addEventListener("click", function(e){
  var b = e.target;
  while(b && b !== nav && b.id !== "bAvanca") b = b.parentNode;
  if(!b || b.id !== "bAvanca") return;
  var a = atualAgora();
  if(a === -1) return;
  if(a[0] <= 0) return;              /* identificacao · motor decide */
  if(a[0] >= a[1]-1) return;         /* ultima tela · motor decide */
  if(!(window.FACA && window.FACA.ir)) return;
  e.stopPropagation();
  e.preventDefault();
  window.FACA.ir(a[0] + 1);
 }, true);
}

function partida(){
 ligaNavOf();
 numeraPassos();
 arrumaVersao();
 ligaMapa();
 ligaLivre();
 var alvo = document.getElementById("cx");
 if(alvo && window.MutationObserver){
  new MutationObserver(function(){ arrumaLista() }).observe(alvo, {childList:true, subtree:true});
 }
 document.addEventListener("click", function(e){
  if(e.target && e.target.id === "bLista") setTimeout(arrumaLista, 80);
 });
}

if(document.readyState === "loading"){
 document.addEventListener("DOMContentLoaded", function(){ setTimeout(partida, 0) });
}else{
 setTimeout(partida, 0);
}
})();
</script>
